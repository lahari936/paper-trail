[project]
name = "papertrail"
version = "0.1.0"
description = "MCP server that lets Alexa+ answer questions about household documents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "rapidfuzz>=3.9",
    "boto3>=1.43.112",
    "pymupdf>=1.28.2",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = ["pytest>=8"]
infra = [
    "aws-cdk-lib>=2.200",
    "constructs>=10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
